<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" />
  </head>
  <body>
    <div id="app-layout">
      <aside id="sidebar" hidden>
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <button class="sidebar-folder-btn" id="change-folder" title="Change folder">
              <span id="folder-name">Sessions</span>
            </button>
            <button class="sidebar-close" id="close-sidebar" title="Close sidebar">&times;</button>
          </div>
          <span class="sidebar-count" id="file-count"></span>
          <div class="sidebar-tabs">
            <button class="sidebar-tab active" data-tab="sessions">Sessions</button>
            <button class="sidebar-tab" data-tab="memories">Memory</button>
          </div>
        </div>
        <div class="file-tree" id="file-tree" data-tab="sessions"></div>
        <div class="file-tree" id="memory-tree" data-tab="memories" hidden></div>
      </aside>
      <main id="app">
        <section id="landing">
          <h1>Session Reader</h1>
          <p class="subtitle">View Claude Code session transcripts</p>
          <div class="drop-zone" id="drop-zone">
            <div class="drop-icon">.jsonl</div>
            <p>Drop a session file or folder here</p>
            <span class="drop-or">or</span>
            <button class="browse-btn" id="browse-btn">Browse</button>
            <input type="file" id="file-input" accept=".jsonl" hidden />
          </div>
          <p class="hint">~/.claude/projects/&lt;project&gt;/&lt;session-id&gt;.jsonl</p>
          <div id="error" class="error-msg" hidden></div>
        </section>

        <section id="session" hidden>
          <div class="meta-bar">
            <button class="back-btn" id="back-btn">&larr; Back</button>
            <dl class="meta-fields" id="meta-fields"></dl>
          </div>
          <div class="transcript" id="transcript"></div>
        </section>

        <section id="memory-view" hidden>
          <div class="meta-bar">
            <button class="back-btn" id="memory-back-btn">&larr; Back</button>
          </div>
          <div class="memory-content" id="memory-content"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
