name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - '.gitignore'
      - '**/.gitignore'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: session-reader-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm -C apps/web run build

      - name: Deploy (cdk -> S3 + CloudFront invalidation)
        run: pnpm -C infra run deploy
